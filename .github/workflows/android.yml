name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'recetas.js'
      - '**.webp'
      - '**.png'
      - 'mobile/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Generar www desde la web
        working-directory: mobile
        run: npm run build:www

      - name: Sincronizar Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Generar iconos y splash
        working-directory: mobile
        run: npm run assets

      - name: Compilar APK (release si hay keystore, debug si no)
        working-directory: mobile
        shell: bash
        run: |
          chmod +x android/gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            node scripts/configure-signing.js
            cd android
            ./gradlew assembleRelease --no-daemon
          else
            echo "::notice::No hay keystore configurado; se genera un APK debug."
            cd android
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: fogon-apk
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
